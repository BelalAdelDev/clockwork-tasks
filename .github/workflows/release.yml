name: Release Obsidian plugin

# Push a tag that equals the version in manifest.json (no "v" prefix), e.g.:
#   git tag 1.2.0 && git push origin 1.2.0
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ($tag) does not match manifest.json version ($version)"
            exit 1
          fi

      - name: Build main.js from src/
        run: node build.js

      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title="$tag" --generate-notes --draft \
            main.js manifest.json
